[Paths]
document_dir= /home/<User>/Documents
gpx_directory = %(document_dir)s/garmin_records/gpx
# set the remote_fit_directory to the MTP path of your Garmin device for newer smartwatches
# its a bit tricky to find, but on Linux you can usually find it under /run/user/<ProcessID>/gvfs/mtp:host=<Some_ID>/
remote_fit_directory = /var/run/user/<ProcessID>/gvfs/mtp:host=<Some_ID>/Internal Storage/GARMIN/Activity
local_fit_directory = %(document_dir)s/garmin_records
summary_cache_file = %(local_fit_directory)s/stats_cache.csv

# the following is optional, if you want your empty FIT files to be moved to a specific directory
# they are empty for example if you did not have a GPS signal during the activity
empty_files_directory = %(local_fit_directory)s/empty_files